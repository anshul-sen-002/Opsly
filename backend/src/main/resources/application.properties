## ========== Server ==========
server.port=8080
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n
spring.profiles.active=local

# ========== Database ==========
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========== JWT ==========
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_EXPIRATION}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

# ========== Initial Admin Bootstrap ==========
app.admin.email=${INITIAL_ADMIN_EMAIL}
app.admin.password=${INITIAL_ADMIN_PASSWORD}

# ========== CORS ==========
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# ========== Auth cookies ==========
# Local dev runs over plain HTTP, so the refresh cookie must not require Secure.
app.cookie.secure=false
app.cookie.same-site=Lax

# ========== AI / Amazon Bedrock ==========
# Bedrock API key (bearer token) + the foundation model to use.
# Both are read from the environment; leave them empty to disable the assistant
# (the app still starts and POST /api/ai/chat reports that it is not configured).
app.ai.bedrock.api-key=${AWS_BEDROCK_API_KEY:}
app.ai.bedrock.region=${AWS_REGION:us-east-1}
app.ai.bedrock.model-id=${BEDROCK_MODEL_ID:}
app.ai.bedrock.endpoint=https://bedrock-runtime.${app.ai.bedrock.region}.amazonaws.com
app.ai.bedrock.max-tokens=1024
app.ai.bedrock.temperature=0.3

# ========== Springdoc / Swagger ==========
springdoc.swagger-ui.path=${SWAGGER_UI_PATH}
springdoc.api-docs.path=${SWAGGER_DOCS_PATH}

# ========== Cloudinary ==========
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ========== Uploads ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB