## ========== Server ==========
# Render sets PORT; default to 8080 for local dev / `docker run`
server.port=${PORT:8080}
# Default profile falls back to 'local' unless SPRING_PROFILES_ACTIVE is set
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# ========== Database ==========
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# hibernate.dialect is not set: Hibernate 6 auto-detects PostgreSQLDialect
# from the JDBC connection.
spring.jpa.properties.hibernate.format_sql=true
# Explicitly keep open-in-view enabled: read paths (JobService, InvoiceService,
# PaymentService, ...) map lazy @ManyToOne associations in non-transactional
# methods and need the EntityManager to stay open for the request. Switch to
# false only after those reads run inside @Transactional(readOnly = true).
spring.jpa.open-in-view=true

# ========== JWT ==========
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_EXPIRATION}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

# ========== Initial Admin Bootstrap ==========
app.admin.email=${INITIAL_ADMIN_EMAIL}
app.admin.password=${INITIAL_ADMIN_PASSWORD}

# ========== CORS ==========
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# ========== Auth cookies ==========
# Local dev runs over plain HTTP, so the refresh cookie must not require Secure.
app.cookie.secure=false
app.cookie.same-site=Lax

# ========== AI / OpenRouter ==========
# The assistant calls OpenRouter's OpenAI-compatible API (https://openrouter.ai).
# Both values come from the environment; leave the model empty or the API key unset to
# disable the assistant (the app still starts and POST /api/ai/chat reports that it is
# not configured). Free models such as google/gemini-2.5-flash-preview-04-17 are available
# without a paid plan.
app.ai.openrouter.base-url=https://openrouter.ai/api/v1
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=${OPENROUTER_MODEL:openrouter/free}
app.ai.openrouter.max-tokens=1024
app.ai.openrouter.temperature=0.3

# ========== OpenSearch (local only, disabled by default) ==========
# No Docker: point at a locally installed OpenSearch, or leave disabled to use
# the PostgreSQL fallback (search still works, OpenRouter/AI untouched).
app.opensearch.enabled=${OPENSEARCH_ENABLED:false}
app.opensearch.host=${OPENSEARCH_HOST:localhost}
app.opensearch.port=${OPENSEARCH_PORT:9200}
app.opensearch.scheme=${OPENSEARCH_SCHEME:http}

# ========== Springdoc / Swagger ==========
springdoc.swagger-ui.path=${SWAGGER_UI_PATH}
springdoc.api-docs.path=${SWAGGER_DOCS_PATH}

# ========== Cloudinary ==========
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ========== Uploads ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


