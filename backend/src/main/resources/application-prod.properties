# ===========================================================================
#  Production profile
#  Active when SPRING_PROFILES_ACTIVE=prod (set by Render)
#  Overrides selected values from application.properties for HTTPS deployment
# ===========================================================================

# --- Server port ----------------------------------------------------------
# Render assigns the container port via the PORT env var; fall back to 8080
server.port=${PORT:8080}

# --- HTTPS / cookies ------------------------------------------------------
# Behind Render's TLS termination the app serves over HTTPS, so the refresh
# token cookie must be Secure and SameSite=None so the Vercel frontend can
# send it cross-site via `credentials: 'include'`.
app.cookie.secure=true
app.cookie.same-site=None

# --- CORS -----------------------------------------------------------------
# Allow the Vercel frontend origin (comma-separated if multiple)
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# --- Database (Aiven PostgreSQL) -----------------------------------------
# Aiven requires SSL; the JDBC URL should include ?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate -------------------------------------------------------------
# In production you may want to switch to validate or flyway-managed schemas
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- AI / OpenRouter (optional) ------------------------------------------
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=${OPENROUTER_MODEL:google/gemini-2.5-flash-preview-04-17}

# --- Cloudinary (optional) -------------------------------------------------
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
